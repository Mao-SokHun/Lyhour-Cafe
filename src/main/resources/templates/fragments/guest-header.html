<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="guest-header" class="site-header" id="header">
  <div class="inner">
    <a href="/home" class="logo">
      <span class="logo-mark"><i class="fa-solid fa-mug-hot"></i></span>
      <span>Lyhour Coffee</span>
    </a>
    <nav class="site-nav">
      <a href="/home">Home</a>
      <a href="/home#product-menu">Menu</a>
      <a href="/home#about">About</a>
      <a href="/home#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="/telegram-app" class="btn btn-sm" style="background:linear-gradient(135deg,#229ed9,#0088cc);color:#fff;border:none;border-radius:999px;padding:0.45rem 0.85rem;font-size:0.8rem;display:inline-flex;align-items:center;gap:0.4rem;font-weight:600;box-shadow:0 2px 8px rgba(0,136,204,0.3);" title="Open Telegram Mini App">
        <i class="fa-brands fa-telegram"></i> <span>Mini App</span>
      </a>
      <a href="/cart" class="icon-btn" aria-label="Cart" title="View Cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-count-badge hidden">0</span>
      </a>
      <a href="/signin" class="btn btn-ghost btn-sm" style="font-size:0.78rem;color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:0.4rem 0.75rem;" title="Staff & Admin Portal">
        <i class="fa-solid fa-lock" style="font-size:0.7rem;margin-right:0.25rem;"></i> Staff
      </a>
      <button type="button" class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="/home">Home</a>
    <a href="/home#product-menu">Menu</a>
    <a href="/home#about">About</a>
    <a href="/home#contact">Contact</a>
    <a href="/telegram-app" style="color:#0088cc;"><i class="fa-brands fa-telegram"></i> Telegram Mini App</a>
    <a href="/cart">Your Bag</a>
    <a href="/signin" style="color:var(--text-muted);"><i class="fa-solid fa-lock"></i> Staff Login</a>
  </div>
</header>
</html>
