<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="product-menu" class="menu-section" id="product-menu" style="padding:4rem 0;">
  <div class="menu-section__glow" aria-hidden="true"></div>
  <div class="container menu-section__inner">
    <header class="menu-section__head" style="text-align:center;margin-bottom:2rem;">
      <span class="menu-section__label" style="text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:var(--accent);font-size:0.85rem;">House Menu · ម៉ឺនុយហាង</span>
      <h2 style="font-size:2.4rem;font-weight:700;margin:0.35rem 0;">Handcrafted Coffee &amp; Bakery</h2>
      <p style="color:var(--text-muted);max-width:600px;margin:0 auto;font-size:0.95rem;">
        Tap any item to add directly to your bag. <b>No account or registration needed!</b>
      </p>
    </header>

    <div class="menu-tabs category-tabs" style="display:flex;justify-content:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:2.5rem;">
      <button type="button" class="menu-tab tab-btn active" data-category="All" style="border-radius:999px;padding:0.5rem 1.25rem;font-weight:600;">
        <i class="fa-solid fa-border-all"></i> All Menu
      </button>
      <button type="button" class="menu-tab tab-btn" data-category="Coffee" style="border-radius:999px;padding:0.5rem 1.25rem;font-weight:600;">
        <i class="fa-solid fa-mug-hot"></i> Coffee
      </button>
      <button type="button" class="menu-tab tab-btn" data-category="Cake" style="border-radius:999px;padding:0.5rem 1.25rem;font-weight:600;">
        <i class="fa-solid fa-cookie-bite"></i> Bakery &amp; Cake
      </button>
      <button type="button" class="menu-tab tab-btn" data-category="Drink" style="border-radius:999px;padding:0.5rem 1.25rem;font-weight:600;">
        <i class="fa-solid fa-glass-water"></i> Beverages
      </button>
    </div>

    <div class="menu-grid product-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:1.5rem;">
      <article th:each="product : ${products}"
               class="menu-card product-card"
               th:data-category="${product.category}"
               style="background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform 0.25s, box-shadow 0.25s;display:flex;flex-direction:column;">
        <div class="menu-card__media" style="position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#1a1512;">
          <img th:src="${product.imageUrl}" th:alt="${product.name}" loading="lazy"
               style="width:100%;height:100%;object-fit:cover;transition:transform 0.4s ease;"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&q=80';">
          <span class="menu-card__category" th:text="${product.category}" style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);color:#fff;font-size:0.75rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;">Coffee</span>
          <span class="menu-card__price-tag" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}" style="position:absolute;bottom:10px;right:10px;background:var(--accent);color:#fff;font-weight:800;font-size:0.95rem;padding:3px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,0.3);">$0.00</span>
          <span th:if="${product.stock <= 10 and product.stock > 0}" class="menu-card__stock-warn" style="position:absolute;top:10px;right:10px;background:#e74c3c;color:#fff;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:999px;">Only [[${product.stock}]] left</span>
          <span th:if="${product.stock <= 0}" class="menu-card__sold-out" style="position:absolute;top:10px;right:10px;background:#7f8c8d;color:#fff;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:999px;">Sold out</span>
        </div>
        <div class="menu-card__body" style="padding:1.25rem;display:flex;flex-direction:column;flex:1;justify-content:space-between;">
          <div>
            <h3 th:text="${product.name}" style="font-size:1.25rem;font-weight:700;margin-bottom:0.35rem;color:var(--text);">Product</h3>
            <p th:text="${product.description}" style="color:var(--text-muted);font-size:0.85rem;line-height:1.45;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">Description</p>
          </div>
          <button type="button"
                  th:if="${product.stock > 0}"
                  class="menu-card__add add-to-cart-btn btn btn-primary"
                  style="width:100%;border-radius:12px;padding:0.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:0.4rem;"
                  th:data-id="${product.id}"
                  th:data-name="${product.name}"
                  th:data-price="${product.price}"
                  th:data-image-url="${product.imageUrl}"
                  th:data-stock="${product.stock}">
            <i class="fa-solid fa-plus"></i>
            <span>Add to Bag</span>
          </button>
          <button type="button" th:if="${product.stock <= 0}" class="menu-card__add btn btn-ghost" disabled style="width:100%;border-radius:12px;opacity:0.5;cursor:not-allowed;">
            Sold Out
          </button>
        </div>
      </article>
    </div>
  </div>
</section>
</html>
